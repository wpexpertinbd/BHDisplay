# Lan Mouse settings for the Windows PC — copy to %LOCALAPPDATA%\lan-mouse\config.toml
# The background service reads ONLY this file, so everything it needs must be here.
port = 4242

# The Mac allowed to send its keyboard/mouse INTO this PC:
# paste the "certificate fingerprint" shown in Lan Mouse on the Mac (lower-case, with colons).
[authorized_fingerprints]
"PASTE:THE:MAC:FINGERPRINT:HERE" = "MacBook"

# The Mac sits to the LEFT of this PC: the pointer leaves Windows at its left edge.
# Use the Mac's IP address — Windows often can't resolve "<name>.local".
[[clients]]
position = "left"
ips = ["192.168.0.123"]
port = 4242
activate_on_startup = true
